events { worker_connections 1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/plain application/json application/javascript text/css;

  upstream backend  { server backend:8000; }
  upstream frontend { server frontend:3000; }

  server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    # Plot images — served directly by nginx from mounted results volumes
    # (bypasses Python backend entirely; always available)
    location /plots/ {
      alias         /app/norm_plots/;
      add_header    Cache-Control "public, max-age=3600";
      try_files     $uri =404;
    }

    location /plots/country/ {
      alias         /app/country_plots/;
      add_header    Cache-Control "public, max-age=3600";
      try_files     $uri =404;
    }

    # API → FastAPI backend
    location /api/ {
      proxy_pass         http://backend;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_read_timeout 120s;
    }

    # Everything else → Vite frontend
    location / {
      proxy_pass         http://frontend;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";
    }
  }
}
